name: CI

on:
  push:
    paths:
      - 'src/**'
  pull_request:
    paths:
      - 'src/**'

env:
  IMAGE_NAME: nbank-tests
  COMPOSE_FILE: infra/docker-compose/docker-compose.yaml
  COMPOSE_PROJECT: docker-compose
  FRAUD_ALIAS: fraud-mock

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build tests Docker image
        id: build
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          LOCAL_IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"
          docker build -t "${LOCAL_IMAGE}" .
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "local_image=${LOCAL_IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Run Checkstyle (flake8)
        run: flake8 src

      - name: Start application with Docker Compose
        env:
          FRAUD_DETECTION_SERVICE_URL: http://${{ env.FRAUD_ALIAS }}:8080
        run: |
          docker compose -p "${COMPOSE_PROJECT}" -f "${COMPOSE_FILE}" up -d --wait

      - name: Run tests
        run: |
          NETWORK_NAME="${COMPOSE_PROJECT}_nbank-network"
          docker run --rm \
            --network "${NETWORK_NAME}" \
            --network-alias "${FRAUD_ALIAS}" \
            -e APIBASEURL=http://backend:4111 \
            -e UIBASEURL=http://frontend \
            "${{ steps.build.outputs.local_image }}" \
            pytest -m api --api-version with_fraud_check

      - name: Stop Docker Compose
        if: always()
        run: |
          docker compose -p "${COMPOSE_PROJECT}" -f "${COMPOSE_FILE}" down --remove-orphans

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push image to Docker Hub
        run: |
          REMOTE_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ steps.build.outputs.image_tag }}"
          docker tag "${{ steps.build.outputs.local_image }}" "${REMOTE_IMAGE}"
          docker push "${REMOTE_IMAGE}"
