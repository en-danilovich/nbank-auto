[pytest]

# log_cli = true
# log_cli_level = DEBUG
# log_format = %(asctime)s %(levelname)s %(message)s
# log_date_format = %H:%M:%S

pythonpath = .

addopts = --browser chromium --browser firefox --browser webkit

markers =
    api: API autotests
    ui: UI autotests
    test: Debug of local tests
    api_version(name): Backend version tag for tests (e.g. with_validation_fix, with_database)
    user_session(count, auth_index): Marker for tests with user login
    admin_session: For tests with admin login
    browsers(names): Tests for only current browsers (chromium|firefox|webkit)
    with_users(count, accounts_count, balance): Marker for tests using accounts_with_balance fixture
    entity_will_be_created(fixture_name): Track entity created by a test for cleanup
    check_all_users_change(delta, username_source, should_exist): Verify users-list delta and presence after a test
    check_accounts_change(delta, account_source): Verify accounts-list delta after a test
    check_profile_name(expected_source): Verify customer profile name after a test (defaults to unchanged)
    fraud_check_mock(**kwargs): Start local mock FraudCheck service for the test. Example: @pytest.mark.fraud_check_mock(port=8089, endpoint=r"/.*", status="SUCCESS", decision="APPROVED", riskScore=0.2, reason="Low risk transaction", requiresManualReview=False, additionalVerificationRequired=False)
    prepare_users(number): Prepare N users via admin API and expose them as fixtures.
    prepare_accounts(number, deposit): Prepare N accounts for prepared users; if deposit is set, deposit same amount to each account.