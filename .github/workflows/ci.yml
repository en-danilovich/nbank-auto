name: CI

on:
  push:
    paths:
      - 'src/**'
  pull_request:
    paths:
      - 'src/**'

env:
  IMAGE_NAME: nbank-tests
  COMPOSE_FILE: infra/docker-compose/docker-compose.yaml
  COMPOSE_PROJECT: docker-compose
  FRAUD_ALIAS: fraud-mock

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build tests Docker image
        id: build
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          LOCAL_IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"
          docker build -t "${LOCAL_IMAGE}" .
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "local_image=${LOCAL_IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Run Checkstyle (flake8)
        run: flake8 src

      - name: Start application with Docker Compose
        env:
          FRAUD_DETECTION_SERVICE_URL: http://${{ env.FRAUD_ALIAS }}:8080
        run: |
          docker compose -p "${COMPOSE_PROJECT}" -f "${COMPOSE_FILE}" up -d --wait

      - name: Prepare coverage-results dir
        run: |
          rm -rf coverage-results
          mkdir -p coverage-results
          # Tests container runs as root and writes into the mount; make sure
          # the runner user can also read it afterwards.
          chmod 777 coverage-results

      - name: Run tests
        run: |
          NETWORK_NAME="${COMPOSE_PROJECT}_nbank-network"
          docker run --rm \
            --network "${NETWORK_NAME}" \
            --network-alias "${FRAUD_ALIAS}" \
            -v "${{ github.workspace }}/coverage-results:/app/coverage-results" \
            -e SERVER=http://backend:4111 \
            -e UI_BASE_URL=http://frontend \
            -e DB_HOST=postgres \
            -e DB_PORT=5432 \
            "${{ steps.build.outputs.local_image }}" \
            pytest -m api --api-version with_fraud_check

      - name: Generate Swagger coverage report
        if: always()
        run: |
          NETWORK_NAME="${COMPOSE_PROJECT}_nbank-network"
          docker run --rm \
            --network "${NETWORK_NAME}" \
            -v "${{ github.workspace }}/coverage-results:/app/coverage-results" \
            --entrypoint swagger-coverage-tool \
            "${{ steps.build.outputs.local_image }}" \
            save-report

      - name: Publish coverage summary to job summary
        if: always()
        run: |
          REPORT="coverage-results/coverage-report.json"
          if [[ ! -f "${REPORT}" ]]; then
            echo "No coverage report found at ${REPORT}" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          python3 - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json, pathlib
          data = json.loads(pathlib.Path("coverage-results/coverage-report.json").read_text())
          endpoints = data["servicesCoverage"]["nbank"]["endpoints"]
          covered = sum(1 for e in endpoints if e["coverage"] == "COVERED")
          total = len(endpoints)
          print("### Swagger API coverage\n")
          print(f"**{covered}/{total} endpoints covered**\n")
          print("| Method | Path | Coverage | Cases |")
          print("|---|---|---|---|")
          for e in endpoints:
              print(f"| {e['method']} | `{e['name']}` | {e['coverage']} | {e['totalCases']} |")
          PY

      - name: Upload Swagger coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swagger-coverage-report
          path: coverage-results/
          if-no-files-found: warn

      - name: Stop Docker Compose
        if: always()
        run: |
          docker compose -p "${COMPOSE_PROJECT}" -f "${COMPOSE_FILE}" down --remove-orphans

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push image to Docker Hub
        id: push
        run: |
          REMOTE_IMAGE="${{ vars.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ steps.build.outputs.image_tag }}"
          docker tag "${{ steps.build.outputs.local_image }}" "${REMOTE_IMAGE}"
          docker push "${REMOTE_IMAGE}"
          IMAGE_URL="https://hub.docker.com/r/${{ vars.DOCKERHUB_USERNAME }}/${IMAGE_NAME}/tags?name=${{ steps.build.outputs.image_tag }}"
          echo "remote_image=${REMOTE_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "image_url=${IMAGE_URL}" >> "${GITHUB_OUTPUT}"
          echo "Pushed image: ${REMOTE_IMAGE}"
          echo "Docker Hub:   ${IMAGE_URL}"

      - name: Publish image link to job summary
        run: |
          {
            echo "### Pushed Docker image"
            echo ""
            echo "- Image: \`${{ steps.push.outputs.remote_image }}\`"
            echo "- Docker Hub: [${{ steps.push.outputs.remote_image }}](${{ steps.push.outputs.image_url }})"
          } >> "${GITHUB_STEP_SUMMARY}"
